---
# ansible/roles/linux-hardening/tasks/main.yml
# CIS benchmark-inspired Linux hardening

# ---------------------------------------------------------------------------
# SSH Hardening
# ---------------------------------------------------------------------------
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: "sshd -t -f %s"
    backup: true
  notify: restart sshd
  tags:
    - hardening
    - ssh

# ---------------------------------------------------------------------------
# Sysctl / Kernel Hardening
# ---------------------------------------------------------------------------
- name: Apply sysctl hardening parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/99-anvilops-hardening.conf
  loop: "{{ sysctl_settings | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  tags:
    - hardening
    - sysctl

# ---------------------------------------------------------------------------
# Firewall (firewalld)
# ---------------------------------------------------------------------------
- name: Ensure firewalld is installed
  ansible.builtin.package:
    name: firewalld
    state: present
  tags:
    - hardening
    - firewall

- name: Ensure firewalld is enabled and started
  ansible.builtin.service:
    name: firewalld
    state: started
    enabled: true
  tags:
    - hardening
    - firewall

- name: Configure allowed firewall services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
    zone: public
  loop: "{{ firewall_allowed_services }}"
  tags:
    - hardening
    - firewall

- name: Set default firewall zone to public (default deny)
  ansible.builtin.command:
    cmd: firewall-cmd --set-default-zone=public
  register: firewall_zone_result
  changed_when: "'ZONE_ALREADY_SET' not in firewall_zone_result.stderr"
  tags:
    - hardening
    - firewall

# ---------------------------------------------------------------------------
# File Permissions
# ---------------------------------------------------------------------------
- name: Set secure permissions on /etc/passwd
  ansible.builtin.file:
    path: /etc/passwd
    owner: root
    group: root
    mode: "0644"
  tags:
    - hardening
    - permissions

- name: Set secure permissions on /etc/shadow
  ansible.builtin.file:
    path: /etc/shadow
    owner: root
    group: root
    mode: "0000"
  tags:
    - hardening
    - permissions

- name: Set secure permissions on /etc/gshadow
  ansible.builtin.file:
    path: /etc/gshadow
    owner: root
    group: root
    mode: "0000"
  tags:
    - hardening
    - permissions

- name: Set secure permissions on /etc/group
  ansible.builtin.file:
    path: /etc/group
    owner: root
    group: root
    mode: "0644"
  tags:
    - hardening
    - permissions

# ---------------------------------------------------------------------------
# Disable Unused Filesystems
# ---------------------------------------------------------------------------
- name: Disable unused filesystems
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # Disable {{ item }} filesystem - CIS benchmark
      install {{ item }} /bin/true
    dest: "/etc/modprobe.d/{{ item }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ disabled_filesystems }}"
  tags:
    - hardening
    - filesystems

# ---------------------------------------------------------------------------
# Auditd
# ---------------------------------------------------------------------------
- name: Ensure auditd is installed
  ansible.builtin.package:
    name: audit
    state: present
  when: auditd_enabled
  tags:
    - hardening
    - auditd

- name: Configure auditd rules for key file monitoring
  ansible.builtin.copy:
    content: |
      # {{ ansible_managed }}
      # AnvilOps audit rules - CIS benchmark inspired

      # Monitor changes to user/group files
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d/ -p wa -k sudoers

      # Monitor SSH config
      -w /etc/ssh/sshd_config -p wa -k sshd_config

      # Monitor login files
      -w /var/log/lastlog -p wa -k logins
      -w /var/log/faillog -p wa -k logins
      -w /var/log/wtmp -p wa -k logins
      -w /var/log/btmp -p wa -k logins

      # Monitor cron
      -w /etc/crontab -p wa -k cron
      -w /etc/cron.d/ -p wa -k cron
      -w /etc/cron.daily/ -p wa -k cron
      -w /etc/cron.hourly/ -p wa -k cron
      -w /etc/cron.weekly/ -p wa -k cron
      -w /etc/cron.monthly/ -p wa -k cron

      # Monitor kernel module loading
      -w /sbin/insmod -p x -k modules
      -w /sbin/rmmod -p x -k modules
      -w /sbin/modprobe -p x -k modules
    dest: /etc/audit/rules.d/99-anvilops.rules
    owner: root
    group: root
    mode: "0640"
  when: auditd_enabled
  notify: restart auditd
  tags:
    - hardening
    - auditd

- name: Ensure auditd is enabled and started
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: auditd_enabled
  tags:
    - hardening
    - auditd

# ---------------------------------------------------------------------------
# Remove Unnecessary Packages
# ---------------------------------------------------------------------------
- name: Remove unnecessary packages
  ansible.builtin.package:
    name: "{{ unnecessary_packages }}"
    state: absent
  tags:
    - hardening
    - packages

# ---------------------------------------------------------------------------
# Umask
# ---------------------------------------------------------------------------
- name: Set secure umask in /etc/profile
  ansible.builtin.lineinfile:
    path: /etc/profile
    regexp: '^\s*umask\s+'
    line: "umask {{ umask_value }}"
    state: present
    backup: true
  tags:
    - hardening
    - umask

- name: Set secure umask in /etc/bashrc
  ansible.builtin.lineinfile:
    path: /etc/bashrc
    regexp: '^\s*umask\s+'
    line: "umask {{ umask_value }}"
    state: present
    backup: true
  when: ansible_os_family == 'RedHat'
  tags:
    - hardening
    - umask

# ---------------------------------------------------------------------------
# Login Policy (login.defs)
# ---------------------------------------------------------------------------
- name: Configure PASS_MAX_DAYS in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MAX_DAYS\s+'
    line: "PASS_MAX_DAYS   {{ pass_max_days }}"
    state: present
  tags:
    - hardening
    - password-policy

- name: Configure PASS_MIN_DAYS in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_MIN_DAYS\s+'
    line: "PASS_MIN_DAYS   {{ pass_min_days }}"
    state: present
  tags:
    - hardening
    - password-policy

- name: Configure PASS_WARN_AGE in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*PASS_WARN_AGE\s+'
    line: "PASS_WARN_AGE   {{ pass_warn_age }}"
    state: present
  tags:
    - hardening
    - password-policy
