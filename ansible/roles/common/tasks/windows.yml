---
# ansible/roles/common/tasks/windows.yml
# Common Windows tasks for all managed servers

- name: Set hostname
  ansible.windows.win_hostname:
    name: "{{ inventory_hostname_short }}"
  register: hostname_result
  tags:
    - common
    - hostname

- name: Reboot after hostname change if required
  ansible.windows.win_reboot:
    reboot_timeout: 600
    msg: "Rebooting after hostname change"
  when: hostname_result.reboot_required | default(false)
  tags:
    - common
    - hostname

- name: Set timezone to {{ timezone }}
  community.windows.win_timezone:
    timezone: "{{ timezone }}"
  tags:
    - common
    - timezone

- name: Create anvilops local admin account
  ansible.windows.win_user:
    name: "{{ anvilops_service_user }}"
    password: "{{ anvilops_service_user_password }}"
    password_never_expires: true
    user_cannot_change_password: true
    groups:
      - Administrators
    state: present
    description: "AnvilOps Service Account"
  when: anvilops_service_user_password is defined and anvilops_service_user_password != ''
  tags:
    - common
    - service-account

- name: Set power plan to High Performance
  ansible.windows.win_powershell:
    script: |
      $highPerf = powercfg /list | Select-String "High performance"
      if ($highPerf -match '(\S{8}-\S{4}-\S{4}-\S{4}-\S{12})') {
          powercfg /setactive $Matches[1]
          $Ansible.Changed = $true
      } else {
          $Ansible.Changed = $false
      }
  tags:
    - common
    - power

- name: Disable unnecessary services
  ansible.windows.win_service:
    name: "{{ item }}"
    state: stopped
    start_mode: disabled
  loop: "{{ windows_disabled_services }}"
  failed_when: false
  tags:
    - common
    - services

- name: Set legal notice caption (MOTD title)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: legalnoticecaption
    data: "AnvilOps Managed Server"
    type: string
  tags:
    - common
    - motd

- name: Set legal notice text (MOTD body)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: legalnoticetext
    data: "{{ motd_banner }}"
    type: string
  tags:
    - common
    - motd
