---
# =============================================================================
# AnvilOps — Deploy Monitoring and Management Agents Playbook
# =============================================================================
# Purpose:  Deploys and configures monitoring and management agents on all
#           AnvilOps-managed servers. Covers CloudWatch Agent, SSM Agent,
#           and optional backup/security agents.
#
# Execution: Runs via AWX job template after base configuration is complete.
#            Cross-platform — handles both Linux and Windows.
#
# Extra vars (optional):
#   - cloudwatch_config:    Path to custom CloudWatch agent config JSON
#   - backup_agent_url:     URL to download backup agent installer
#   - security_agent_url:   URL to download security/AV agent installer
#
# Tags: cloudwatch, ssm, backup, security
# =============================================================================

- name: AnvilOps Deploy Monitoring and Management Agents
  hosts: all
  become: true
  gather_facts: true

  vars:
    cloudwatch_config: ""
    backup_agent_url: ""
    security_agent_url: ""

  tasks:
    # =========================================================================
    # Amazon CloudWatch Agent — Linux
    # =========================================================================
    - name: Deploy CloudWatch Agent (Linux)
      when: ansible_os_family in ['RedHat', 'Debian']
      block:
        - name: Check if CloudWatch Agent is already installed (Linux)
          ansible.builtin.stat:
            path: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
          register: cw_agent_linux

        - name: Download CloudWatch Agent (RHEL)
          ansible.builtin.get_url:
            url: "https://s3.{{ aws_region }}.amazonaws.com/amazoncloudwatch-agent-{{ aws_region }}/amazon_linux/amd64/latest/amazon-cloudwatch-agent.rpm"
            dest: /tmp/amazon-cloudwatch-agent.rpm
            mode: "0644"
          when:
            - not cw_agent_linux.stat.exists
            - ansible_os_family == "RedHat"

        - name: Install CloudWatch Agent RPM (RHEL)
          ansible.builtin.yum:
            name: /tmp/amazon-cloudwatch-agent.rpm
            state: present
            disable_gpg_check: true
          when:
            - not cw_agent_linux.stat.exists
            - ansible_os_family == "RedHat"

        - name: Download CloudWatch Agent (Debian)
          ansible.builtin.get_url:
            url: "https://s3.{{ aws_region }}.amazonaws.com/amazoncloudwatch-agent-{{ aws_region }}/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb"
            dest: /tmp/amazon-cloudwatch-agent.deb
            mode: "0644"
          when:
            - not cw_agent_linux.stat.exists
            - ansible_os_family == "Debian"

        - name: Install CloudWatch Agent DEB (Debian)
          ansible.builtin.apt:
            deb: /tmp/amazon-cloudwatch-agent.deb
            state: present
          when:
            - not cw_agent_linux.stat.exists
            - ansible_os_family == "Debian"

        - name: Deploy default CloudWatch Agent configuration (Linux)
          ansible.builtin.copy:
            content: |
              {
                "agent": {
                  "metrics_collection_interval": 60,
                  "run_as_user": "cwagent",
                  "logfile": "/opt/aws/amazon-cloudwatch-agent/logs/amazon-cloudwatch-agent.log"
                },
                "metrics": {
                  "namespace": "AnvilOps/EC2",
                  "metrics_collected": {
                    "cpu": {
                      "measurement": ["cpu_usage_idle", "cpu_usage_user", "cpu_usage_system"],
                      "metrics_collection_interval": 60,
                      "totalcpu": true
                    },
                    "disk": {
                      "measurement": ["used_percent", "inodes_free"],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "diskio": {
                      "measurement": ["io_time", "write_bytes", "read_bytes"],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "mem": {
                      "measurement": ["mem_used_percent", "mem_available"],
                      "metrics_collection_interval": 60
                    },
                    "swap": {
                      "measurement": ["swap_used_percent"],
                      "metrics_collection_interval": 60
                    },
                    "netstat": {
                      "measurement": ["tcp_established", "tcp_time_wait"],
                      "metrics_collection_interval": 60
                    }
                  },
                  "append_dimensions": {
                    "InstanceId": "${aws:InstanceId}",
                    "AutoScalingGroupName": "${aws:AutoScalingGroupName}"
                  }
                },
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/syslog",
                          "log_group_name": "/anvilops/servers/syslog",
                          "log_stream_name": "{instance_id}",
                          "retention_in_days": 30
                        },
                        {
                          "file_path": "/var/log/messages",
                          "log_group_name": "/anvilops/servers/messages",
                          "log_stream_name": "{instance_id}",
                          "retention_in_days": 30
                        },
                        {
                          "file_path": "/var/log/anvilops/*.log",
                          "log_group_name": "/anvilops/servers/app",
                          "log_stream_name": "{instance_id}",
                          "retention_in_days": 30
                        }
                      ]
                    }
                  }
                }
              }
            dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
            owner: root
            group: root
            mode: "0644"
          when: cloudwatch_config | length == 0
          notify: Restart CloudWatch Agent Linux

        - name: Deploy custom CloudWatch Agent configuration (Linux)
          ansible.builtin.copy:
            src: "{{ cloudwatch_config }}"
            dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
            owner: root
            group: root
            mode: "0644"
          when: cloudwatch_config | length > 0
          notify: Restart CloudWatch Agent Linux

        - name: Start CloudWatch Agent with configuration (Linux)
          ansible.builtin.command: >
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
            -a fetch-config
            -m ec2
            -s
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
          register: cw_start_result
          changed_when: "'Start CWAgent' in cw_start_result.stdout"

        - name: Ensure CloudWatch Agent service is enabled
          ansible.builtin.systemd:
            name: amazon-cloudwatch-agent
            state: started
            enabled: true
      rescue:
        - name: CloudWatch Agent deployment failed (Linux)
          ansible.builtin.debug:
            msg: "WARNING: CloudWatch Agent deployment failed on {{ inventory_hostname }}. Manual investigation required."
      tags:
        - cloudwatch

    # =========================================================================
    # Amazon CloudWatch Agent — Windows
    # =========================================================================
    - name: Deploy CloudWatch Agent (Windows)
      when: ansible_os_family == 'Windows'
      block:
        - name: Check if CloudWatch Agent is installed (Windows)
          ansible.windows.win_service:
            name: AmazonCloudWatchAgent
          register: cw_agent_win
          failed_when: false

        - name: Download CloudWatch Agent MSI (Windows)
          ansible.windows.win_get_url:
            url: "https://s3.{{ aws_region }}.amazonaws.com/amazoncloudwatch-agent-{{ aws_region }}/windows/amd64/latest/amazon-cloudwatch-agent.msi"
            dest: 'C:\Temp\amazon-cloudwatch-agent.msi'
          when: cw_agent_win.state is not defined or cw_agent_win.state != 'running'

        - name: Ensure C:\Temp directory exists
          ansible.windows.win_file:
            path: 'C:\Temp'
            state: directory

        - name: Install CloudWatch Agent MSI (Windows)
          ansible.windows.win_package:
            path: 'C:\Temp\amazon-cloudwatch-agent.msi'
            state: present
          when: cw_agent_win.state is not defined or cw_agent_win.state != 'running'

        - name: Deploy default CloudWatch Agent configuration (Windows)
          ansible.windows.win_copy:
            content: |
              {
                "agent": {
                  "metrics_collection_interval": 60,
                  "logfile": "C:\\ProgramData\\Amazon\\AmazonCloudWatchAgent\\Logs\\amazon-cloudwatch-agent.log"
                },
                "metrics": {
                  "namespace": "AnvilOps/EC2",
                  "metrics_collected": {
                    "Processor": {
                      "measurement": ["% Idle Time", "% User Time", "% Interrupt Time"],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "LogicalDisk": {
                      "measurement": ["% Free Space"],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "Memory": {
                      "measurement": ["% Committed Bytes In Use", "Available MBytes"],
                      "metrics_collection_interval": 60
                    },
                    "Paging File": {
                      "measurement": ["% Usage"],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    },
                    "Network Interface": {
                      "measurement": ["Bytes Sent/sec", "Bytes Received/sec"],
                      "metrics_collection_interval": 60,
                      "resources": ["*"]
                    }
                  },
                  "append_dimensions": {
                    "InstanceId": "${aws:InstanceId}"
                  }
                },
                "logs": {
                  "logs_collected": {
                    "windows_events": {
                      "collect_list": [
                        {
                          "event_name": "System",
                          "event_levels": ["ERROR", "WARNING"],
                          "log_group_name": "/anvilops/servers/windows-system",
                          "log_stream_name": "{instance_id}",
                          "retention_in_days": 30
                        },
                        {
                          "event_name": "Application",
                          "event_levels": ["ERROR", "WARNING"],
                          "log_group_name": "/anvilops/servers/windows-application",
                          "log_stream_name": "{instance_id}",
                          "retention_in_days": 30
                        },
                        {
                          "event_name": "Security",
                          "event_levels": ["ERROR", "WARNING"],
                          "log_group_name": "/anvilops/servers/windows-security",
                          "log_stream_name": "{instance_id}",
                          "retention_in_days": 30
                        }
                      ]
                    }
                  }
                }
              }
            dest: 'C:\ProgramData\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent.json'
          when: cloudwatch_config | length == 0
          notify: Restart CloudWatch Agent Windows

        - name: Start CloudWatch Agent with configuration (Windows)
          ansible.windows.win_shell: |
            & "C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1" `
              -a fetch-config -m ec2 -s `
              -c "file:C:\ProgramData\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent.json"
          register: cw_win_start
          changed_when: "'Successfully' in cw_win_start.stdout"
          failed_when: false

        - name: Ensure CloudWatch Agent service is running (Windows)
          ansible.windows.win_service:
            name: AmazonCloudWatchAgent
            start_mode: auto
            state: started
      rescue:
        - name: CloudWatch Agent deployment failed (Windows)
          ansible.builtin.debug:
            msg: "WARNING: CloudWatch Agent deployment failed on {{ inventory_hostname }}. Manual investigation required."
      tags:
        - cloudwatch

    # =========================================================================
    # AWS SSM Agent — verify and enable
    # =========================================================================
    - name: Verify SSM Agent (Linux)
      when: ansible_os_family in ['RedHat', 'Debian']
      block:
        - name: Check SSM Agent status (Linux)
          ansible.builtin.systemd:
            name: amazon-ssm-agent
          register: ssm_status_linux

        - name: Ensure SSM Agent is enabled and running (Linux)
          ansible.builtin.systemd:
            name: amazon-ssm-agent
            state: started
            enabled: true

        - name: Report SSM Agent status (Linux)
          ansible.builtin.debug:
            msg: "SSM Agent status: {{ ssm_status_linux.status.ActiveState | default('unknown') }}"
      tags:
        - ssm

    - name: Verify SSM Agent (Windows)
      when: ansible_os_family == 'Windows'
      block:
        - name: Ensure SSM Agent is running (Windows)
          ansible.windows.win_service:
            name: AmazonSSMAgent
            start_mode: auto
            state: started
          register: ssm_status_windows

        - name: Report SSM Agent status (Windows)
          ansible.builtin.debug:
            msg: "SSM Agent state: {{ ssm_status_windows.state | default('unknown') }}"
      tags:
        - ssm

    # =========================================================================
    # Backup Agent (placeholder — configurable via extra_var)
    # =========================================================================
    - name: Deploy Backup Agent (Linux)
      when:
        - backup_agent_url | length > 0
        - ansible_os_family in ['RedHat', 'Debian']
      block:
        - name: Download backup agent (Linux)
          ansible.builtin.get_url:
            url: "{{ backup_agent_url }}"
            dest: /tmp/backup-agent-installer
            mode: "0755"

        - name: Install backup agent (Linux)
          ansible.builtin.command: /tmp/backup-agent-installer --install --quiet
          args:
            creates: /opt/backup-agent/bin/backup-agent
          register: backup_install_linux

        - name: Report backup agent installation (Linux)
          ansible.builtin.debug:
            msg: "Backup agent installed from {{ backup_agent_url }}"
      rescue:
        - name: Backup agent installation failed (Linux)
          ansible.builtin.debug:
            msg: "WARNING: Backup agent installation failed. URL: {{ backup_agent_url }}"
      tags:
        - backup

    - name: Deploy Backup Agent (Windows)
      when:
        - backup_agent_url | length > 0
        - ansible_os_family == 'Windows'
      block:
        - name: Download backup agent (Windows)
          ansible.windows.win_get_url:
            url: "{{ backup_agent_url }}"
            dest: 'C:\Temp\backup-agent-installer.exe'

        - name: Install backup agent (Windows)
          ansible.windows.win_package:
            path: 'C:\Temp\backup-agent-installer.exe'
            arguments: "/S /v/qn"
            state: present

        - name: Report backup agent installation (Windows)
          ansible.builtin.debug:
            msg: "Backup agent installed from {{ backup_agent_url }}"
      rescue:
        - name: Backup agent installation failed (Windows)
          ansible.builtin.debug:
            msg: "WARNING: Backup agent installation failed. URL: {{ backup_agent_url }}"
      tags:
        - backup

    - name: Skip backup agent — no URL provided
      ansible.builtin.debug:
        msg: "Backup agent skipped — no backup_agent_url provided. Set this extra var to deploy."
      when: backup_agent_url | length == 0
      tags:
        - backup

    # =========================================================================
    # Security / AV Agent (placeholder — configurable via extra_var)
    # =========================================================================
    - name: Deploy Security Agent (Linux)
      when:
        - security_agent_url | length > 0
        - ansible_os_family in ['RedHat', 'Debian']
      block:
        - name: Download security agent (Linux)
          ansible.builtin.get_url:
            url: "{{ security_agent_url }}"
            dest: /tmp/security-agent-installer
            mode: "0755"

        - name: Install security agent (Linux)
          ansible.builtin.command: /tmp/security-agent-installer --install --quiet
          args:
            creates: /opt/security-agent/bin/security-agent
          register: security_install_linux

        - name: Report security agent installation (Linux)
          ansible.builtin.debug:
            msg: "Security agent installed from {{ security_agent_url }}"
      rescue:
        - name: Security agent installation failed (Linux)
          ansible.builtin.debug:
            msg: "WARNING: Security agent installation failed. URL: {{ security_agent_url }}"
      tags:
        - security

    - name: Deploy Security Agent (Windows)
      when:
        - security_agent_url | length > 0
        - ansible_os_family == 'Windows'
      block:
        - name: Download security agent (Windows)
          ansible.windows.win_get_url:
            url: "{{ security_agent_url }}"
            dest: 'C:\Temp\security-agent-installer.exe'

        - name: Install security agent (Windows)
          ansible.windows.win_package:
            path: 'C:\Temp\security-agent-installer.exe'
            arguments: "/S /v/qn"
            state: present

        - name: Report security agent installation (Windows)
          ansible.builtin.debug:
            msg: "Security agent installed from {{ security_agent_url }}"
      rescue:
        - name: Security agent installation failed (Windows)
          ansible.builtin.debug:
            msg: "WARNING: Security agent installation failed. URL: {{ security_agent_url }}"
      tags:
        - security

    - name: Skip security agent — no URL provided
      ansible.builtin.debug:
        msg: "Security agent skipped — no security_agent_url provided. Set this extra var to deploy."
      when: security_agent_url | length == 0
      tags:
        - security

  # ===========================================================================
  # Handlers
  # ===========================================================================
  handlers:
    - name: Restart CloudWatch Agent Linux
      ansible.builtin.command: >
        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a stop && /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
        -a fetch-config -m ec2 -s
        -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
      when: ansible_os_family != 'Windows'

    - name: Restart CloudWatch Agent Windows
      ansible.windows.win_shell: |
        & "C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1" -a stop
        & "C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1" `
          -a fetch-config -m ec2 -s `
          -c "file:C:\ProgramData\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent.json"
      when: ansible_os_family == 'Windows'
