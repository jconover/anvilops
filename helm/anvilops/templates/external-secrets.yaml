{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "anvilops.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.secretStore.provider.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.api.serviceAccount.name }}
---
# Shared secret: REDIS_URL — consumed by API, worker, and beat
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "anvilops.fullname" . }}-shared-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "anvilops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ include "anvilops.fullname" . }}-shared-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "{{ `{{` }} .redis_url {{ `}}` }}"
  data:
    - secretKey: redis_url
      remoteRef:
        key: anvilops/redis
        property: url
---
# API secret: DATABASE_URL + COGNITO_CLIENT_SECRET
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "anvilops.fullname" . }}-api-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "anvilops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ include "anvilops.fullname" . }}-api-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ `{{` }} .db_url {{ `}}` }}"
        COGNITO_CLIENT_SECRET: "{{ `{{` }} .cognito_secret {{ `}}` }}"
  data:
    - secretKey: db_url
      remoteRef:
        key: anvilops/database
        property: url
    - secretKey: cognito_secret
      remoteRef:
        key: anvilops/cognito
        property: client_secret
---
# Worker secret: DATABASE_URL + all integration credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "anvilops.fullname" . }}-worker-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "anvilops.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ include "anvilops.fullname" . }}-worker-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ `{{` }} .db_url {{ `}}` }}"
        AWX_PASSWORD: "{{ `{{` }} .awx_password {{ `}}` }}"
        PUPPET_API_TOKEN: "{{ `{{` }} .puppet_token {{ `}}` }}"
        SLACK_WEBHOOK_URL: "{{ `{{` }} .slack_webhook {{ `}}` }}"
        SLACK_SIGNING_SECRET: "{{ `{{` }} .slack_signing {{ `}}` }}"
        SERVICENOW_PASSWORD: "{{ `{{` }} .servicenow_password {{ `}}` }}"
  data:
    - secretKey: db_url
      remoteRef:
        key: anvilops/database
        property: url
    - secretKey: awx_password
      remoteRef:
        key: anvilops/awx
        property: password
    - secretKey: puppet_token
      remoteRef:
        key: anvilops/puppet
        property: api_token
    - secretKey: slack_webhook
      remoteRef:
        key: anvilops/slack
        property: webhook_url
    - secretKey: slack_signing
      remoteRef:
        key: anvilops/slack
        property: signing_secret
    - secretKey: servicenow_password
      remoteRef:
        key: anvilops/servicenow
        property: password
{{- end }}
