{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace }}
  labels:
    {{- include "anvilops.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: {{ .Values.namespace.podSecurity.enforce }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: {{ .Values.namespace.podSecurity.warn }}
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: {{ .Values.namespace.podSecurity.enforce }}
    pod-security.kubernetes.io/audit-version: latest
{{- end }}
