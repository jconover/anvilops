{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anvilops.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "anvilops.componentLabels" (list . "frontend") | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "anvilops.componentSelectorLabels" (list . "frontend") | nindent 4 }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
{{- end }}
