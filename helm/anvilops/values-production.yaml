api:
  replicaCount: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    minReplicas: 3
    maxReplicas: 20
  pdb:
    minAvailable: 2

frontend:
  replicaCount: 3
  pdb:
    minAvailable: 2

worker:
  replicaCount: 4
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 4Gi
  pdb:
    minAvailable: 2

config:
  ENVIRONMENT: "production"
  DEBUG: "false"
  NEXT_PUBLIC_API_URL: "https://api.anvilops.example.com/api/v1"
  SLACK_ENABLED: "true"
  SERVICENOW_ENABLED: "true"

ingress:
  host: anvilops.example.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ""
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/group.name: anvilops
    alb.ingress.kubernetes.io/tags: "Environment=production,Application=anvilops"
