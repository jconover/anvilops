---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: anvilops
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: anvilops-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anvilops-secrets
  namespace: anvilops
  labels:
    app.kubernetes.io/part-of: anvilops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: anvilops-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "{{ .db_url }}"
        REDIS_URL: "{{ .redis_url }}"
        COGNITO_CLIENT_SECRET: "{{ .cognito_secret }}"
        AWX_PASSWORD: "{{ .awx_password }}"
        PUPPET_API_TOKEN: "{{ .puppet_token }}"
        SLACK_WEBHOOK_URL: "{{ .slack_webhook }}"
        SLACK_SIGNING_SECRET: "{{ .slack_signing }}"
        SERVICENOW_PASSWORD: "{{ .servicenow_password }}"
  data:
    - secretKey: db_url
      remoteRef:
        key: anvilops/database
        property: url
    - secretKey: redis_url
      remoteRef:
        key: anvilops/redis
        property: url
    - secretKey: cognito_secret
      remoteRef:
        key: anvilops/cognito
        property: client_secret
    - secretKey: awx_password
      remoteRef:
        key: anvilops/awx
        property: password
    - secretKey: puppet_token
      remoteRef:
        key: anvilops/puppet
        property: api_token
    - secretKey: slack_webhook
      remoteRef:
        key: anvilops/slack
        property: webhook_url
    - secretKey: slack_signing
      remoteRef:
        key: anvilops/slack
        property: signing_secret
    - secretKey: servicenow_password
      remoteRef:
        key: anvilops/servicenow
        property: password
