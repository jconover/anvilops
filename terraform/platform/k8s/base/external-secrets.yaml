---
# SecretStore is environment-agnostic — kept in base.
# ExternalSecret is environment-specific — defined in each overlay
# (overlays/dev/external-secrets.yaml, etc.) because AWS Secrets Manager
# key names include the environment (e.g. anvilops-dev/rds/credentials).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: anvilops
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: anvilops-api
