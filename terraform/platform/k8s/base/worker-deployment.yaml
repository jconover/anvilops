apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvilops-worker
  namespace: anvilops
  labels:
    app.kubernetes.io/name: anvilops-worker
    app.kubernetes.io/part-of: anvilops
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: anvilops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvilops-worker
        app.kubernetes.io/part-of: anvilops
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: anvilops-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 300
      containers:
        - name: worker
          image: anvilops-api:MUST_BE_OVERRIDDEN
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - default,terraform,notifications
          envFrom:
            - configMapRef:
                name: anvilops-config
            - secretRef:
                name: anvilops-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
                - --timeout
                - "5"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
      restartPolicy: Always
