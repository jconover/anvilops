apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvilops-worker
  namespace: anvilops
  labels:
    app.kubernetes.io/name: anvilops-worker
    app.kubernetes.io/part-of: anvilops
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: anvilops-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvilops-worker
        app.kubernetes.io/part-of: anvilops
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: anvilops-worker
      containers:
        - name: worker
          image: anvilops-api:latest
          command:
            - celery
            - -A
            - app.worker.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - -Q
            - default,terraform,notifications
          envFrom:
            - configMapRef:
                name: anvilops-config
            - secretRef:
                name: anvilops-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      restartPolicy: Always
