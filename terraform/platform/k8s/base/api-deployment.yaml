apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvilops-api
  namespace: anvilops
  labels:
    app.kubernetes.io/name: anvilops-api
    app.kubernetes.io/part-of: anvilops
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: anvilops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvilops-api
        app.kubernetes.io/part-of: anvilops
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: anvilops-api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: anvilops-api
      containers:
        - name: api
          image: anvilops-api:latest
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: anvilops-config
            - secretRef:
                name: anvilops-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
