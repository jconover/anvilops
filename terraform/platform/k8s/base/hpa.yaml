# NOTE: The anvilops-worker deployment is NOT managed by a standalone HPA.
# KEDA manages autoscaling for the worker via a ScaledObject (keda-celery-scaledobject)
# defined in terraform/platform/helm/install-charts.tf. KEDA creates and owns its own
# HPA internally, so a separate HPA here would conflict and cause scaling oscillation.
# Only the API HPA is defined below.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anvilops-api-hpa
  namespace: anvilops
  labels:
    app.kubernetes.io/part-of: anvilops
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anvilops-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
