---
# Dev environment ExternalSecret
# Maps AWS Secrets Manager keys (created by Terraform) to the anvilops-secrets
# K8s Secret consumed by api, worker, and beat deployments via secretRef.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: anvilops-secrets
  namespace: anvilops
  labels:
    app.kubernetes.io/part-of: anvilops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: anvilops-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Construct full PostgreSQL connection URL from individual credential fields
        DATABASE_URL: "postgresql+asyncpg://{{ .db_username }}:{{ .db_password }}@{{ .db_host }}:{{ .db_port }}/{{ .db_name }}"
        COGNITO_CLIENT_SECRET: "{{ .cognito_secret }}"
        AWX_PASSWORD: "{{ .awx_password }}"
        PUPPET_API_TOKEN: "{{ .puppet_token }}"
        # Override ConfigMap REDIS_URL with authenticated TLS URL
        REDIS_URL: "rediss://:{{ .redis_auth_token }}@master.anvilops-dev.1jnokz.use1.cache.amazonaws.com:6379/0?ssl_cert_reqs=CERT_REQUIRED"
        REDIS_AUTH_TOKEN: "{{ .redis_auth_token }}"
  data:
    # RDS credentials (Terraform: modules/rds aws_secretsmanager_secret.db_credentials)
    - secretKey: db_username
      remoteRef:
        key: anvilops-dev/rds/credentials
        property: username
    - secretKey: db_password
      remoteRef:
        key: anvilops-dev/rds/credentials
        property: password
    - secretKey: db_host
      remoteRef:
        key: anvilops-dev/rds/credentials
        property: host
    - secretKey: db_port
      remoteRef:
        key: anvilops-dev/rds/credentials
        property: port
    - secretKey: db_name
      remoteRef:
        key: anvilops-dev/rds/credentials
        property: dbname
    # Redis auth token (Terraform: modules/elasticache aws_secretsmanager_secret.redis_auth_token)
    # Plain string secret — no property extraction needed
    - secretKey: redis_auth_token
      remoteRef:
        key: anvilops/dev/redis-auth-token
    # Cognito client secret (Terraform: modules/cognito aws_secretsmanager_secret.client_secret)
    - secretKey: cognito_secret
      remoteRef:
        key: anvilops-dev/cognito/client-secret
        property: client_secret
    # AWX password (Terraform: helm/install-charts.tf aws_secretsmanager_secret.awx)
    - secretKey: awx_password
      remoteRef:
        key: anvilops/awx
        property: password
    # Puppet API token (Terraform: modules/puppet aws_secretsmanager_secret.puppet_api_token)
    - secretKey: puppet_token
      remoteRef:
        key: anvilops/puppet
        property: api_token
    # NOTE: Slack and ServiceNow secrets are not included here because:
    # - SLACK_ENABLED=false and SERVICENOW_ENABLED=false in the dev ConfigMap
    # - No Terraform resources create these secrets for dev
    # Add them when enabling these integrations for this environment.
