apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

patches:
  - target:
      kind: Deployment
      name: anvilops-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints

  - target:
      kind: Deployment
      name: anvilops-worker
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - celery
          - -A
          - app.worker.celery_app
          - worker
          - --loglevel=info
          - --concurrency=1

  - target:
      kind: Deployment
      name: anvilops-frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: anvilops-api-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  - target:
      kind: HorizontalPodAutoscaler
      name: anvilops-worker-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3

  - target:
      kind: ConfigMap
      name: anvilops-config
    patch: |
      - op: replace
        path: /data/ENVIRONMENT
        value: dev
      - op: replace
        path: /data/DEBUG
        value: "true"
      - op: replace
        path: /data/NEXT_PUBLIC_API_URL
        value: "https://dev-api.anvilops.internal/api/v1"

  - target:
      kind: Ingress
      name: anvilops-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: dev.anvilops.example.com
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1tags
        value: "Environment=dev,Application=anvilops"

# Image references are placeholders — deploy-app.sh / deploy-app.ps1 replace
# these with the actual ECR URI and image tag at deploy time.
images:
  - name: anvilops-api
    newName: 457780993905.dkr.ecr.us-east-1.amazonaws.com/anvilops-api
    newTag: "191def8"
  - name: anvilops-frontend
    newName: 457780993905.dkr.ecr.us-east-1.amazonaws.com/anvilops-frontend
    newTag: "191def8"
