clusterName: ${cluster_name}

serviceAccount:
  create: true
  name: aws-load-balancer-controller
  annotations:
    eks.amazonaws.com/role-arn: ${alb_controller_role_arn}

region: ${region}
vpcId: ${vpc_id}

enableShield: false
enableWaf: false
enableWafv2: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

replicaCount: 2

podDisruptionBudget:
  minAvailable: 1
