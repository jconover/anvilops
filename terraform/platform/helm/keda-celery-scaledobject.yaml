# KEDA ScaledObject — primary autoscaler for the anvilops-worker deployment.
# KEDA creates and manages its own HPA internally for this target.
# Do NOT create a separate HPA for anvilops-worker in k8s/base/hpa.yaml or
# overlays, as dual HPAs cause scaling oscillation (both controllers fight
# over the replica count).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: anvilops-worker
  namespace: anvilops
spec:
  scaleTargetRef:
    name: anvilops-worker
  pollingInterval: 15
  cooldownPeriod: 60
  minReplicaCount: 2
  maxReplicaCount: 6
  triggers:
    - type: redis
      metadata:
        address: ${redis_endpoint}:6379
        listName: celery
        listLength: "10"
        enableTLS: "true"
      authenticationRef:
        name: redis-auth
