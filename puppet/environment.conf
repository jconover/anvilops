# Puppet environment configuration for AnvilOps
# Controls module path resolution and manifest location

# Module search path: site-modules (our code) → modules (Forge via r10k) → base
modulepath = site-modules:modules:$basemodulepath

# Main site manifest for node classification fallback
manifest = manifests/site.pp

# Environment timeout: 0 for development (always reparse)
# In production PE environments, consider 'unlimited' for performance
environment_timeout = 0
